name: PR Test

on:
  pull_request:
    branches:
      - master
      - test
      - staging
      - release

concurrency:
  group: pr-test-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test:
    name: Test
    needs: [gitleaks]
    runs-on: ubuntu-latest

    steps:
      - name: Log Node & OS versions
        run: |
          node -v
          cat /etc/os-release

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Checkout @openlytic/auth (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Backend.Service.Auth
          path: ../Backend.Service.Auth

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install PNPM
        run: npm i -g pnpm

      - name: Build @openlytic/auth
        working-directory: ../Backend.Service.Auth
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Checking Lint And Build Errors
        run: pnpm run build

  notification:
    name: Notification
    if: ${{ failure() }}
    needs: [gitleaks, test]
    runs-on: ubuntu-latest
    steps:
      - name: Notify dedicated teams channel
        uses: jdcargile/ms-teams-notification@v1.3
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.SLACK_WEBHOOK }}
          notification-summary: PR test failed for ${{ github.event.pull_request.head.ref }} → ${{ github.base_ref }}!
          notification-color: dc3545
          timezone: Asia/Dhaka
